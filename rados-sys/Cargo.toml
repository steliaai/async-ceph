[package]
name = "rados-sys"
description = "Low-level FFI bindings to Ceph's librados"
keywords = ["ceph", "rados", "librados"]
categories = ["external-ffi-bindings", "filesystem"]
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[target.'cfg(not(ceph_sys_bundled))'.build-dependencies]
ceph-bindings-gen.workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustc-args = ["--cfg", "ceph_sys_bundled"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(ceph_sys_bundled)",
    "cfg(ceph_sys_pregen_bindings)"
]
